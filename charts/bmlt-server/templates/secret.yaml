{{- /*
Bundle plaintext-supplied sensitive values into a Secret so they are not
inlined into the Deployment/CronJob pod spec. Only keys that are set via
plaintext values (and not already sourced from an external Secret) are
included; if none apply, no Secret is rendered.
*/ -}}
{{- $createPassword := and .Values.database.password (not .Values.database.secrets.password) -}}
{{- $createGoogle := and .Values.bmlt.googleApiKey (not .Values.bmlt.secrets.googleApiKey) -}}
{{- if or $createPassword $createGoogle }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bmlt-server.fullname" . }}
  labels:
    {{- include "bmlt-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $createPassword }}
  db-password: {{ .Values.database.password | quote }}
  {{- end }}
  {{- if $createGoogle }}
  google-api-key: {{ .Values.bmlt.googleApiKey | quote }}
  {{- end }}
{{- end }}
