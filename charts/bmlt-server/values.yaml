# Default values for bmlt-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: bmltenabled/bmlt-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion. Set to
  # "latest" to always track the newest published image.
  tag: ""

bmlt:
  aggregatorMode:
    enabled: true
    schedule: "0 */2 * * *"
  # Google Maps API key, exposed to the app as GOOGLE_API_KEY.
  googleApiKey: ""
  secrets: {}
    # googleApiKey:
    #   name: "google-creds"
    #   key: "google-key"

database:
  host: "mysql.bmlt.svc.cluster.local"
  port: 3306
  name: rootserver
  username: rootserver
  password: rootserver
  # Table prefix, exposed as DB_PREFIX (defaults to "na" when unset).
  dbprefix: "na"
  secrets: {}
    # username:
    #   name: "database-creds"
    #   key: "db-admin-user"
    # password:
    #   name: "database-creds"
    #   key: "db-admin-password"

# Extra environment variables passed verbatim to the server and aggregator
# containers, e.g. MEETING_STATES_AND_PROVINCES, ENABLE_LANGUAGE_SELECTOR,
# AGGREGATOR_USER_AGENT.
extraEnv: []
  # - name: ENABLE_LANGUAGE_SELECTOR
  #   value: "true"
  # - name: MEETING_STATES_AND_PROVINCES
  #   value: "CT,MA,NH,NJ,NY,PA,VT"

service:
  type: ClusterIP
  # This is external port
  port: 8000
  # Only used when type is NodePort or LoadBalancer.
  nodePort: 30288
  # Extra annotations for the Service, e.g. cloud load-balancer settings.
  annotations: {}

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Supply these for a real ALB deploy (left out so a default install does not
    # render an invalid Ingress):
    # alb.ingress.kubernetes.io/subnets: "subnet-1234, subnet-5678"
    # alb.ingress.kubernetes.io/certificate-arn: "<ACM ARN>"
  hosts:
    - host: bmlt.mydomain.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a ServiceAccount should be created.
  create: true
  # Automatically mount the ServiceAccount's API token.
  automount: true
  # Annotations to add to the ServiceAccount (e.g. IAM role for IRSA).
  annotations: {}
  # Name to use; if empty and create is true, a name is generated from the
  # fullname template.
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# CPU/memory requests are set so the pod gets Burstable QoS and so the CPU
# HorizontalPodAutoscaler has a request to measure against. Tune for your load;
# set to {} to leave resources unconstrained.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
